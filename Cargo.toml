[package]
name = "hebrew-tty"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hebrew-tty"
path = "src/main.rs"

[[test]]
name = "measurements"
path = "tests/measurements.rs"

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
crossterm = { version = "=0.29.0", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["fs", "signal"] }
portable-pty = { version = "=0.9.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["process"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
toml = "=0.9.8"
unicode-bidi = "=0.3.18"
unicode-bidi-mirroring = "=0.4.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
