[package]
name = "hebrew-tty"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hebrew-tty"
path = "src/main.rs"

[[test]]
name = "measurements"
path = "tests/measurements.rs"

[dependencies]
crossterm = { version = "=0.29.0", default-features = false }
nix = { version = "=0.28.0", default-features = false, features = ["signal"] }
portable-pty = { version = "=0.9.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["process"] }
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
